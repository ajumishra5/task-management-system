{% extends "core/base.html" %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-body">
                <h4 class="mb-3">
                    {% if is_edit %}Edit Task{% else %}Create Task{% endif %}
                </h4>

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <input type="text" name="title" class="form-control"
                        value="{% if task %}{{ task.title }}{% endif %}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Priority</label>
                        <select name="priority" class="form-select">
                            <option value="low" {% if task and task.priority == "low" %}selected{% endif %}>Low</option>
                            <option value="medium" {% if task and task.priority == "medium" %}selected{% endif %}>Medium</option>
                            <option value="high" {% if task and task.priority == "high" %}selected{% endif %}>High</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Due Date</label>
                        <input type="datetime-local"
                        name="due_date"
                        class="form-control"
                        value="{% if task and task.due_date %}
                                {{ task.due_date|date:'Y-m-d\\TH:i' }}
                            {% endif %}">
                        </div>

                    <div class="mb-3">
                        <label class="form-label">Assign To</label>
                        <select name="assigned_to" class="form-select">
                        <option value="">-- Select User --</option>
                        {% for user in users %}
                            <option value="{{ user.id }}"
                            {% if task and task.assigned_to and task.assigned_to.id == user.id %}
                              selected
                            {% endif %}
                               >
                           {{ user.email }}
                           </option>
                       {% endfor %}
                        </select>
                    </div>



                    <button type="submit" class="btn btn-success w-100">
                        {% if is_edit %}Update Task{% else %}Create Task{% endif %}
                    </button>
                </form>

            </div>
        </div>
    </div>
</div>

{% endblock %}
